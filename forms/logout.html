<!--
 * Filename: /forms/logout.html
 *
 * This file provides the RoadReady logout page.
 *
 * Responsibilities:
 * - Display the logout status to the user.
 * - Inform the user that their RoadReady session is ending.
 * - Load the shared RoadReady stylesheet and external UI libraries.
 * - Load the RoadReady logout JavaScript.
 *
 * This file does NOT:
 * - Destroy the user session directly.
 * - Query MySQL.
 * - Manage authentication directly.
 *
 * Logout processing is handled by /client/js/auth/logout.js
 * and /server/routes/auth.js.
-->
 
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Logout | RoadReady</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

    <!-- RoadReady Styles -->
    <link rel="stylesheet" href="/client/css/styles.css">
</head>

<body>

    <main class="auth-page">

        <div class="auth-container">

            <div class="auth-card">

                <div class="auth-logo">
                    Road<span>Ready</span>
                </div>

                <h1>Signing out</h1>

                <p id="logoutMessage" class="auth-subtitle">
                    Ending your RoadReady session...
                </p>

                <div
                    id="logoutStatus"
                    class="alert"
                    style="display: none;"
                ></div>

            </div>

        </div>

    </main>

    <script src="/client/js/auth/logout.js"></script>

</body>

</html>
