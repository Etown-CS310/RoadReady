
<!--
 * Filename: /forms/profile.html
 *
 * This file provides the RoadReady user profile page.
 *
 * Responsibilities:
 * - Display the authenticated user's information.
 * - Provide an interface for changing passwords.
 * - Display password update errors and success messages.
 * - Load shared RoadReady components and styling.
 * - Load the profile JavaScript.
 *
 * This file does NOT:
 * - Query MySQL directly.
 * - Verify passwords directly.
 * - Update account records directly.
 *
 * Profile information and password changes are handled by
 * /client/js/pages/profile.js and /server/routes/auth.js.
-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile | RoadReady</title>

    <link rel="icon" href="data:,">

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

    <link rel="stylesheet" href="/client/css/styles.css">
</head>

<body>

<main class="main">

    <header class="topbar">

        <div>
            <h1>My Profile</h1>

            <p>
                Manage your RoadReady account and security settings.
            </p>
        </div>

        <div id="dashboard-user" class="profile"></div>

    </header>


    <!-- Account Information -->

    <section class="panel">

        <div class="panel-header">
            <h2>
                <i class="fa-solid fa-user"></i>
                Account Information
            </h2>
        </div>

        <div class="p-3">

            <p>
                <strong>Name:</strong>
                <span id="profile-name">Loading...</span>
            </p>

            <p>
                <strong>Email:</strong>
                <span id="profile-email">Loading...</span>
            </p>

        </div>

    </section>


    <!-- Change Password -->

    <section class="panel mt-4">

        <div class="panel-header">
            <h2>
                <i class="fa-solid fa-lock"></i>
                Change Password
            </h2>
        </div>

        <div class="p-3">

            <p>
                Update your password to keep your account secure.
            </p>

            <div
                id="passwordError"
                class="alert error"
                style="display: none;"
            ></div>

            <div
                id="passwordSuccess"
                class="alert alert-success"
                style="display: none;"
            ></div>

            <form id="passwordForm" class="auth-form">

                <label for="currentPassword">
                    Current Password
                </label>

                <input
                    type="password"
                    id="currentPassword"
                    name="currentPassword"
                    autocomplete="current-password"
                    placeholder="Enter your current password"
                    required
                >

                <label for="newPassword">
                    New Password
                </label>

                <input
                    type="password"
                    id="newPassword"
                    name="newPassword"
                    autocomplete="new-password"
                    minlength="8"
                    placeholder="Enter your new password"
                    required
                >

                <label for="confirmPassword">
                    Confirm New Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    autocomplete="new-password"
                    minlength="8"
                    placeholder="Confirm your new password"
                    required
                >

                <button
                    type="submit"
                    id="passwordButton"
                    class="button auth-button"
                >
                    <i class="fa-solid fa-key"></i>
                    Update Password
                </button>

            </form>

        </div>

    </section>


    <div class="mt-4">
        <a href="/dashboard.html" class="view-link">
            <i class="fa-solid fa-arrow-left"></i>
            Back to Dashboard
        </a>
    </div>

</main>


<script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

<script src="/client/components/navbar.js"></script>
<script src="/client/components/footer.js"></script>
<script src="/client/js/app.js"></script>

<script src="/client/js/pages/profile.js"></script>

</body>

</html>
