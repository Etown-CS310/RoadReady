
<!--
 * Filename: /forms/register.html
 *
 * This file provides the RoadReady registration page.
 *
 * Responsibilities:
 * - Display the account registration form.
 * - Collect the user's name, email, and password.
 * - Display registration errors and success messages.
 * - Load the RoadReady registration JavaScript.
 *
 * This file does NOT:
 * - Create database records directly.
 * - Hash passwords directly.
 * - Create authentication sessions directly.
 *
 * Registration is handled by /client/js/auth/register.js
 * and /server/routes/auth.js.
-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | RoadReady</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

    <link rel="stylesheet" href="/client/css/styles.css">
</head>

<body>

    <main class="auth-page">

        <div class="auth-container">

            <div class="auth-card">

                <div class="auth-logo">
                    Road<span>Ready</span>
                </div>

                <h1>Create an account</h1>

                <p class="auth-subtitle">
                    Join RoadReady to manage your vehicles and maintenance.
                </p>

                <div
                    id="registerError"
                    class="alert error"
                    style="display: none;"
                ></div>

                <div
                    id="registerSuccess"
                    class="alert alert-success"
                    style="display: none;"
                ></div>

                <form id="registerForm" class="auth-form">

                    <label for="fullName">Full Name</label>

                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Your full name"
                        autocomplete="name"
                        maxlength="100"
                        required
                    >

                    <label for="email">Email</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="you@example.com"
                        autocomplete="email"
                        maxlength="255"
                        required
                    >

                    <label for="password">Password</label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                    <label for="confirmPassword">Confirm Password</label>

                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Confirm your password"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >

                    <button
                        id="registerButton"
                        type="submit"
                        class="button auth-button"
                    >
                        <i class="fa-solid fa-user-plus"></i>
                        Create Account
                    </button>

                </form>

                <p class="mt-4 text-center">
                    Already have an account?
                    <a href="login.html">Sign in</a>
                </p>

            </div>

            <footer class="site-footer">
                <p>RoadReady &copy; 2026</p>
            </footer>

        </div>

    </main>

    <script src="/client/js/auth/register.js"></script>

</body>

</html>
