
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reminders | RoadReady</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    >

    <!-- RoadReady Styles -->
    <link
        rel="stylesheet"
        href="/client/css/styles.css"
    >

</head>

<body>

    <!-- Navbar component -->
    <script src="/client/components/navbar.js"></script>


    <main class="main reminders-page">

        <!-- PAGE HEADER -->
        <section class="mb-4">

            <div class="d-flex justify-content-between align-items-center flex-wrap gap-3">

                <div>

                    <h1>Reminders</h1>

                    <p class="text-muted mb-0">
                        Keep track of upcoming vehicle maintenance
                        and important reminders.
                    </p>

                </div>

                <button
                    type="button"
                    class="btn btn-primary"
                    id="showAddReminder"
                >
                    <i class="fa-solid fa-plus"></i>
                    Add Reminder
                </button>

            </div>

        </section>


        <!-- VEHICLE SELECTOR -->
        <section class="mb-4">

            <label
                for="reminderVehicle"
                class="form-label"
            >
                Select Vehicle
            </label>

            <select
                id="reminderVehicle"
                class="form-select"
            >
                <option value="">
                    Loading vehicles...
                </option>
            </select>

        </section>


        <!-- REMINDER SUMMARY -->
        <section class="row g-3 mb-4">

            <div class="col-md-4">

                <div class="card h-100">

                    <div class="card-body">

                        <div class="d-flex justify-content-between align-items-center">

                            <div>
                                <p class="text-muted mb-1">
                                    Overdue
                                </p>

                                <h2
                                    id="overdueCount"
                                    class="mb-0"
                                >
                                    0
                                </h2>
                            </div>

                            <i class="fa-solid fa-triangle-exclamation text-danger fa-2x"></i>

                        </div>

                    </div>

                </div>

            </div>


            <div class="col-md-4">

                <div class="card h-100">

                    <div class="card-body">

                        <div class="d-flex justify-content-between align-items-center">

                            <div>
                                <p class="text-muted mb-1">
                                    Due Soon
                                </p>

                                <h2
                                    id="soonCount"
                                    class="mb-0"
                                >
                                    0
                                </h2>
                            </div>

                            <i class="fa-solid fa-clock text-warning fa-2x"></i>

                        </div>

                    </div>

                </div>

            </div>


            <div class="col-md-4">

                <div class="card h-100">

                    <div class="card-body">

                        <div class="d-flex justify-content-between align-items-center">

                            <div>
                                <p class="text-muted mb-1">
                                    Upcoming
                                </p>

                                <h2
                                    id="upcomingCount"
                                    class="mb-0"
                                >
                                    0
                                </h2>
                            </div>

                            <i class="fa-solid fa-calendar-check text-success fa-2x"></i>

                        </div>

                    </div>

                </div>

            </div>

        </section>


        <!-- ADD REMINDER PANEL -->
        <section
            id="addReminderPanel"
            class="card mb-4"
            style="display: none;"
        >

            <div class="card-header d-flex justify-content-between align-items-center">

                <h2 class="h5 mb-0">
                    Add Custom Reminder
                </h2>

                <button
                    type="button"
                    class="btn-close"
                    id="closeAddReminder"
                    aria-label="Close"
                ></button>

            </div>


            <div class="card-body">

                <form id="reminderForm">

                    <div class="mb-3">

                        <label
                            for="reminderName"
                            class="form-label"
                        >
                            Reminder Name
                        </label>

                        <input
                            type="text"
                            id="reminderName"
                            class="form-control"
                            maxlength="100"
                            placeholder="Example: Replace windshield wipers"
                            required
                        >

                    </div>


                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label
                                for="reminderDueDate"
                                class="form-label"
                            >
                                Due Date
                            </label>

                            <input
                                type="date"
                                id="reminderDueDate"
                                class="form-control"
                            >

                        </div>


                        <div class="col-md-6 mb-3">

                            <label
                                for="reminderDueMileage"
                                class="form-label"
                            >
                                Due Mileage
                            </label>

                            <input
                                type="number"
                                id="reminderDueMileage"
                                class="form-control"
                                min="0"
                                step="1"
                                placeholder="Example: 75000"
                            >

                        </div>

                    </div>


                    <div class="mb-3">

                        <label
                            for="reminderNotes"
                            class="form-label"
                        >
                            Notes
                        </label>

                        <textarea
                            id="reminderNotes"
                            class="form-control"
                            rows="3"
                            maxlength="255"
                            placeholder="Additional details..."
                        ></textarea>

                    </div>


                    <div class="d-flex gap-2">

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Save Reminder
                        </button>

                        <button
                            type="button"
                            class="btn btn-outline-secondary"
                            id="cancelAddReminder"
                        >
                            Cancel
                        </button>

                    </div>

                </form>

            </div>

        </section>


        <!-- REMINDER FILTERS -->
        <section class="mb-3">

            <div class="d-flex flex-wrap gap-2">

                <button
                    type="button"
                    class="btn btn-outline-secondary reminder-filter active"
                    data-filter="all"
                >
                    All
                </button>

                <button
                    type="button"
                    class="btn btn-outline-danger reminder-filter"
                    data-filter="overdue"
                >
                    Overdue
                </button>

                <button
                    type="button"
                    class="btn btn-outline-warning reminder-filter"
                    data-filter="soon"
                >
                    Due Soon
                </button>

                <button
                    type="button"
                    class="btn btn-outline-success reminder-filter"
                    data-filter="upcoming"
                >
                    Upcoming
                </button>

                <button
                    type="button"
                    class="btn btn-outline-primary reminder-filter"
                    data-filter="completed"
                >
                    Completed
                </button>

            </div>

        </section>


        <!-- REMINDER LIST -->
        <section class="card">

            <div class="card-header">

                <h2 class="h5 mb-0">
                    Your Reminders
                </h2>

            </div>

            <div
                class="card-body"
                id="reminderList"
            >

                <div class="text-muted">
                    Loading reminders...
                </div>

            </div>

        </section>

    </main>


    <!-- Footer component -->
    <script src="/client/components/footer.js"></script>


    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    ></script>


    <!-- RoadReady JavaScript -->
    <script src="/client/js/app.js"></script>
    <script src="/client/js/reminders.js"></script>
    <script src="/client/js/auth/auth-guard.js"></script>

</body>

</html>
