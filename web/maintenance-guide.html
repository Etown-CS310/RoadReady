<!--
 * Filename: /web/maintenance-guide.html
 *
 * This file provides the user-facing RoadReady Maintenance Guide page.
 *
 * Responsibilities:
 * - Define the Maintenance Guide page structure.
 * - Provide the guide topic navigation.
 * - Provide the selected guide article area.
 * - Display article summaries, content, and maintenance risks.
 * - Load shared RoadReady components and styling.
 * - Load the Maintenance Guide JavaScript interface.
 * - Load the authentication guard.
 *
 * This file does NOT:
 * - Query MySQL directly.
 * - Process guide data directly.
 * - Manage authentication directly.
 *
 * Guide data is loaded through /client/js/pages/maintenance-guide.js
 * and /server/routes/maintenance-guide.js.
-->
 
<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maintenance Guide | RoadReady</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- RoadReady Styles -->
    <link rel="stylesheet" href="/client/css/styles.css">
    <link rel="icon" href="data:,">

</head>

<body>


<main class="main">

    <!-- Topbar -->

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="../includes/navbar.js"></script>
    <script src="../includes/footer.js"></script>
    <script src="../includes/app.js"></script>
    <header class="topbar">

        <div>
            <h1>Maintenance Guide</h1>
            <p>Learn why routine maintenance matters.</p>
        </div>

        <div id="guide-user" class="profile"></div>

    </header>


    <!-- Guide -->

    <section class="guide-layout">

        <!-- Topics -->

        <aside class="panel guide-sidebar">

            <h2>Topics</h2>

            <div id="guide-topics"></div>

        </aside>


        <!-- Article -->

        <article class="panel guide-article">

            <span id="guide-category" class="guide-category"></span>

            <h2 id="guide-title"></h2>

            <p id="guide-summary" class="guide-summary"></p>

            <div id="guide-body" class="guide-body"></div>


            <div class="risk-box">

                <h3>Risks if skipped</h3>

                <p id="guide-risks"></p>

            </div>

        </article>

    </section>

</main>

<!-- Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- RoadReady Components -->
<script src="/client/components/navbar.js"></script>
<script src="/client/components/footer.js"></script>
<script src="/client/js/app.js"></script>

<!-- Maintenance Guide -->
<script src="/client/js/pages/maintenance-guide.js"></script>

<!-- Authentication -->
<script src="/client/js/auth/auth-guard.js"></script>

</body>

</html>
