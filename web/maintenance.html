<!--
 * Filename: /web/maintenance.html
 *
 * This file provides the user-facing RoadReady Maintenance page.
 *
 * Responsibilities:
 * - Define the Maintenance page structure.
 * - Provide containers for scheduled maintenance and history.
 * - Provide the vehicle selection interface.
 * - Load shared RoadReady components and styling.
 * - Load the Maintenance JavaScript interface.
 * - Load the authentication guard.
 *
 * This file does NOT:
 * - Query MySQL directly.
 * - Process maintenance records directly.
 * - Manage authentication directly.
 *
 * Maintenance data is loaded through /client/js/pages/maintenance.js
 * and /server/routes/maintenance.js.
-->
 
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Maintenance | RoadReady</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- RoadReady Styles -->
    <link rel="stylesheet" href="/client/css/styles.css">
    <link rel="icon" href="data:,">
</head>

<body>

    <main class="main">

        <header class="topbar">
            <div>
                <h1>Maintenance</h1>
                <p>Track upcoming service and completed maintenance.</p>
            </div>

            <div id="maintenance-user"></div>
        </header>

        <div class="vehicle-selector">

            <label for="maintenanceVehicle">
                Vehicle
            </label>

            <select id="maintenanceVehicle"></select>

        </div>

        <section class="content-grid maintenance-layout">

            <section class="panel">
                <h2>Upcoming Maintenance</h2>

                <div id="maintenance-list">
                    <div class="empty-state-small">
                        No scheduled maintenance.
                    </div>
                </div>
            </section>

            <section class="panel">
                <h2>Add Maintenance</h2>

                <form id="maintenanceForm" class="form-grid">

                    <label for="maintenanceType">
                        Maintenance Type
                    </label>

                    <select id="maintenanceType" required>
                        <option value="">Select service</option>
                        <option>Oil Change</option>
                        <option>Brake Inspection</option>
                        <option>Tire Rotation</option>
                        <option>Air Filter</option>
                        <option>Transmission Service</option>
                    </select>

                    <label for="dueMileage">Due Mileage</label>

                    <input type="number" id="dueMileage" min="0" placeholder="e.g. 145000">

                    <label for="dueDate">Due Date</label>

                    <input type="date" id="dueDate">

                    <label for="notes">Notes</label>

                    <textarea
                        id="notes"
                        maxlength="255"
                        rows="3"
                    ></textarea>

                    <button type="submit" class="button">
                        Add Schedule Item
                    </button>

                </form>
            </section>

        </section>

        <section class="panel">
            <h2>Maintenance History</h2>
            <div id="maintenance-history"></div>
        </section>

    </main>

<!-- Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- RoadReady Components -->
<script src="/client/components/navbar.js"></script>
<script src="/client/components/footer.js"></script>
<script src="/client/js/app.js"></script>

<!-- Maintenance -->
<script src="/client/js/pages/maintenance.js"></script>

<!-- Authentication -->
<script src="/client/js/auth/auth-guard.js"></script>

</body>

</html>
