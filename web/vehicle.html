<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Vehicle | RoadReady</title>

    <link rel="stylesheet" href="../includes/styles.css">
</head>

<body>

    <main class="main">

        <div id="vehicle-content">

            <!-- Topbar -->
            <div id="vehicle-topbar"></div>

            <!-- Import CSV -->
            <div id="import_csv">
                <button id="import">
                    Import Vehicle CSV Data
                </button>

                <input
                    type="file"
                    id="csv-input"
                    style="display: none;"
                >
            </div>

            <!-- Vehicle List -->
            <div
                class="vehicle-list"
                id="vehicle-list"
            ></div>

            <!-- Vehicle Details -->
            <section class="vehicle-detail-card">

                <div class="vehicle-detail-header">

                    <div>
                        <h2 id="vehicle-title"></h2>

                        <p
                            id="vehicle-nickname"
                            class="vehicle-nickname"
                        ></p>
                    </div>

                    <span
                        id="vehicle-mileage"
                        class="mileage"
                    ></span>

                </div>

                <div class="detail-grid">

                    <div>
                        <span>VIN</span>
                        <strong id="vehicle-vin"></strong>
                    </div>

                    <div>
                        <span>Trim</span>
                        <strong id="vehicle-trim"></strong>
                    </div>

                    <div>
                        <span>Engine</span>
                        <strong id="vehicle-engine"></strong>
                    </div>

                    <div>
                        <span>Transmission</span>
                        <strong id="vehicle-transmission"></strong>
                    </div>

                    <div>
                        <span>Body Type</span>
                        <strong id="vehicle-body-type"></strong>
                    </div>

                </div>

            </section>

            <!-- Vehicle Value -->
            <div id="vehicle-value"></div>

        </div>

    </main>

    <script src="../includes/navbar.js"></script>
    <script src="../includes/footer.js"></script>
    <script src="../includes/app.js"></script>

    <script src="../js/data.js"></script>
    <script src="../js/vehicle.js"></script>

</body>

</html>
