<!--
 * Filename: /web/vehicle.html
 *
 * This file provides the user-facing RoadReady My Vehicle page.
 *
 * Responsibilities:
 * - Define the My Vehicle page structure.
 * - Provide the vehicle selection interface.
 * - Display selected vehicle information.
 * - Provide the vehicle CSV import interface.
 * - Provide the vehicle value display area.
 * - Load shared RoadReady components and styling.
 * - Load the Vehicle JavaScript interface.
 * - Load the authentication guard.
 *
 * This file does NOT:
 * - Query MySQL directly.
 * - Process vehicle database records directly.
 * - Manage authentication directly.
 *
 * Vehicle data is loaded through /client/js/pages/vehicle.js
 * and /server/routes/vehicles.js.
-->
 
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Vehicle | RoadReady</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <!-- RoadReady Styles -->
    <link rel="stylesheet" href="/client/css/styles.css">
    <link rel="icon" href="data:,">
</head>

<body>

    <main class="main">

        <div id="vehicle-content">

            <!-- Topbar -->
            <div id="vehicle-topbar"></div>

            <!-- Import CSV -->
            <div id="import_csv">
                <button id="import">
                    Import Vehicle CSV Data
                </button>

                <input type="file" id="csv-input" style="display: none;"
                >
            </div>

            <!-- Vehicle List -->
            <div class="vehicle-list" id="vehicle-list"></div>
            
            <!-- Vehicle Details -->
            <section class="vehicle-detail-card">
                <div class="vehicle-detail-header">
                    <div>
                        <h2 id="vehicle-title"></h2>
                        <p id="vehicle-nickname" class="vehicle-nickname"></p>
                    </div>
                    <span id="vehicle-mileage" class="mileage"></span>
                </div>

                <div class="detail-grid">
                    <div>
                        <span>VIN</span>
                        <strong id="vehicle-vin"></strong>
                    </div>

                    <div>
                        <span>Trim</span>
                        <strong id="vehicle-trim"></strong>
                    </div>

                    <div>
                        <span>Engine</span>
                        <strong id="vehicle-engine"></strong>
                    </div>

                    <div>
                        <span>Transmission</span>
                        <strong id="vehicle-transmission"></strong>
                    </div>

                    <div>
                        <span>Body Type</span>
                        <strong id="vehicle-body-type"></strong>
                    </div>
                </div>
            </section>
            <!-- Vehicle Value -->
            <div id="vehicle-value"></div>
        </div>
    </main>

<!-- Bootstrap JavaScript -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- RoadReady Components -->
<script src="/client/components/navbar.js"></script>
<script src="/client/components/footer.js"></script>
<script src="/client/js/app.js"></script>

<!-- Vehicle -->
<script src="/client/js/pages/vehicle.js"></script>

<!-- Authentication -->
<script src="/client/js/auth/auth-guard.js"></script>
    
</body>

</html>
